name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          # Ищем папку, где лежит build.gradle.kts или build.gradle
          BUILD_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Файлы проекта Android не найдены!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Переходим в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Запускаем сборку через системный gradle
          gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
